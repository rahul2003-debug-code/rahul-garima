<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#4A040F" />
      <stop offset="60%" stop-color="#270005" />
      <stop offset="100%" stop-color="#120002" />
    </radialGradient>
    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#F5DE93" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="600" height="700" fill="url(#bgGlow)" />
  
  <!-- Royal Archway & Border -->
  <rect x="25" y="25" width="550" height="650" rx="20" fill="none" stroke="url(#goldH)" stroke-width="2" opacity="0.6" />
  <rect x="35" y="35" width="530" height="630" rx="15" fill="none" stroke="url(#goldH)" stroke-width="1" stroke-dasharray="6,4" opacity="0.4" />
  
  <!-- Corner Ornaments -->
  <g fill="url(#goldH)" opacity="0.8">
    <path d="M45,45 Q75,45 75,75 Q45,75 45,45 Z" />
    <path d="M555,45 Q525,45 525,75 Q555,75 555,45 Z" />
    <path d="M45,655 Q75,655 75,625 Q45,625 45,655 Z" />
    <path d="M555,655 Q525,655 525,625 Q555,625 555,655 Z" />
  </g>

  <!-- Central Bridal Silhouette & Ornaments -->
  <g transform="translate(300, 260)">
    <!-- Aura Ring -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#goldH)" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.5" />
    <circle cx="0" cy="0" r="130" fill="#2E010A" stroke="url(#goldH)" stroke-width="3" filter="url(#softGlow)" />
    
    <!-- Stylized Traditional Indian Bride Silhouette -->
    <!-- Royal Dupatta / Veil -->
    <path d="M-65,70 C-75,10 -60,-60 0,-75 C60,-60 75,10 65,70 C45,60 20,65 0,65 C-20,65 -45,60 -65,70 Z" fill="#800E13" stroke="url(#goldH)" stroke-width="2" />
    <!-- Face Contour -->
    <path d="M-22,-15 C-25,18 -15,42 0,42 C15,42 25,18 22,-15 C20,-28 10,-32 0,-32 C-10,-32 -20,-28 -22,-15 Z" fill="#F8EDEB" />
    <!-- Hair & Bun -->
    <path d="M-22,-15 C-18,-35 18,-35 22,-15 C15,-28 -15,-28 -22,-15 Z" fill="#1C1917" />
    <circle cx="0" cy="-35" r="14" fill="#1C1917" />
    <!-- Maang Tikka -->
    <line x1="0" y1="-35" x2="0" y2="-12" stroke="url(#goldH)" stroke-width="2" />
    <circle cx="0" cy="-10" r="4" fill="url(#goldH)" />
    <!-- Bindi -->
    <circle cx="0" cy="-3" r="2.5" fill="#D90429" />
    <!-- Traditional Bridal Nath (Nose Ring) -->
    <circle cx="-12" cy="12" r="7" fill="none" stroke="url(#goldH)" stroke-width="1.5" />
    <path d="M-12,12 Q-18,5 -22,-5" fill="none" stroke="url(#goldH)" stroke-width="1" />
    <!-- Jhumka (Earrings) -->
    <g transform="translate(-24, 8)">
      <circle cx="0" cy="0" r="2" fill="url(#goldH)" />
      <path d="M-4,3 L4,3 L2,8 L-2,8 Z" fill="url(#goldH)" />
    </g>
    <g transform="translate(24, 8)">
      <circle cx="0" cy="0" r="2" fill="url(#goldH)" />
      <path d="M-4,3 L4,3 L2,8 L-2,8 Z" fill="url(#goldH)" />
    </g>
    <!-- Royal Choker / Necklace -->
    <path d="M-16,35 Q0,48 16,35" fill="none" stroke="url(#goldH)" stroke-width="3" />
    <path d="M-20,44 Q0,60 20,44" fill="none" stroke="url(#goldH)" stroke-width="2" stroke-dasharray="3,2" />
    <!-- Embellished Dupatta Border -->
    <path d="M-60,70 C-70,10 -55,-55 0,-70 C55,-55 70,10 60,70" fill="none" stroke="url(#goldH)" stroke-width="3" stroke-dasharray="4,3" />
  </g>

  <!-- Typography & Badges -->
  <text x="300" y="470" font-family="'Cinzel Decorative', 'Cinzel', serif" font-size="28" font-weight="bold" fill="url(#goldH)" text-anchor="middle" letter-spacing="3">GARIMA VERMA</text>
  <text x="300" y="515" font-family="'Rozha One', 'Yatra One', serif" font-size="26" fill="#F3E5AB" text-anchor="middle">आयु० गरिमा वर्मा</text>
  <text x="300" y="555" font-family="'Yatra One', 'Tiro Devanagari Hindi', serif" font-size="18" fill="#D4AF37" text-anchor="middle">|| सुपुत्री — श्रीमती पूनम वर्मा एवं श्री विनोद कुमार ||</text>
  <text x="300" y="590" font-family="'Outfit', sans-serif" font-size="14" fill="#C9A227" text-anchor="middle" letter-spacing="4">THE BRIDE — दुल्हन</text>
  
  <rect x="180" y="615" width="240" height="36" rx="18" fill="rgba(212, 175, 55, 0.15)" stroke="url(#goldH)" stroke-width="1" />
  <text x="300" y="638" font-family="'Outfit', sans-serif" font-size="12" fill="#FFEAA7" text-anchor="middle" letter-spacing="1">✨ Royal Indian Bride ✨</text>
</svg>
